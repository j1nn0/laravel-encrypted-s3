services:
  moto:
    image: motoserver/moto:5.2.2
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:5000/moto-api/ >/dev/null || wget -q -O - http://localhost:5000/moto-api/ >/dev/null
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
